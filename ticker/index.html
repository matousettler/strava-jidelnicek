<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nástěnka</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .ticker-wrapper {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-track {
            display: inline-block;
            animation: ticker 60s linear infinite;
        }

        .ticker-text {
            display: inline-block;
            font-family: 'Nunito', sans-serif;
            font-size: 60px;
            font-weight: 600;
            color: #fff;
            padding-right: 25vw; /* mezera mezi koncem a začátkem */
        }

        @keyframes ticker {
            0%   { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div class="ticker-wrapper">
        <div class="ticker-track">
            <span class="ticker-text">Toto je nová digitální nástěnka! Najdete tu různé novinky a zajímavosti ze školy. Tento týden zprávy ze zájezdu do Velké Británie a Irska.</span>

        </div>
    </div>
</body>
</html>
