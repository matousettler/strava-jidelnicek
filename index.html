<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jídelníček Widget</title>
    <style>
        :root {
            --bg-widget: #3b2942;
            --bg-header: #4c2b4d;
            --bg-card: #231726;
            --accent-pink: #ef91c5;
            --text-main: #f1d8e6;
            --text-dim: #9d8396;
            --font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: transparent;
            font-family: var(--font-family);
            color: var(--text-main);
            overflow: hidden;
        }

        .widget {
            background-color: var(--bg-widget);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .header {
            background-color: var(--bg-header);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .flower { color: var(--accent-pink); font-size: 1.5rem; }
        .dots { color: var(--text-dim); letter-spacing: 2px; }

        .content {
            padding: 10px 20px 20px 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .section-title {
            color: var(--accent-pink);
            font-size: 1rem;
            margin: 20px 0 10px 4px;
            font-weight: 500;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .card-header {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .tag {
            background-color: var(--accent-pink);
            color: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.8rem;
            min-width: 32px;
            text-align: center;
        }

        .dish-name { line-height: 1.4; font-size: 0.95rem; }
        .dish-name b { color: var(--accent-pink); font-weight: 500; }

        .meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            opacity: 0.6;
        }

        .icon { width: 14px; height: 14px; fill: currentColor; }
        .allergens { display: flex; gap: 4px; flex-wrap: wrap; }
        .allergen-tag {
            font-size: 0.7rem;
            background: rgba(255,255,255,0.05);
            padding: 1px 5px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .loading, .no-data { 
            text-align: center; 
            padding: 50px 20px; 
            color: var(--text-dim);
            line-height: 1.5;
        }

        /* Scrollbar */
        .content::-webkit-scrollbar { width: 5px; }
        .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="widget">
    <div class="header">
        <div class="header-title">
            <span class="flower">✿</span>
            <span id="label">Zjišťuji menu...</span>
        </div>
        <div class="dots">● ● ●</div>
    </div>
    <div class="content" id="app">
        <div class="loading">Načítám data z jídelny...</div>
    </div>
</div>

<script>
    function formatDate(date) {
        // Vrací YYYY-MM-DD
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    async function init() {
        const app = document.getElementById('app');
        const label = document.getElementById('label');

        try {
            const res = await fetch('/api/menu');
            if (!res.ok) throw new Error('API error');
            const xmlText = await res.text();
            const xml = new DOMParser().parseFromString(xmlText, "text/xml");

            const now = new Date();
            let targetDate = new Date(now);

            // Logika překlopení dne v 14:00
            if (now.getHours() >= 14) {
                targetDate.setDate(targetDate.getDate() + 1);
            }

            // Víkendová logika (v So/Ne skočit na Pondělí)
            if (targetDate.getDay() === 6) targetDate.setDate(targetDate.getDate() + 2);
            else if (targetDate.getDay() === 0) targetDate.setDate(targetDate.getDate() + 1);

            const targetStrISO = formatDate(targetDate);
            const days = Array.from(xml.getElementsByTagName("den"));

            // Hledání dne v XML (zkoušíme různé formáty datumu)
            let dayData = days.find(d => {
                const attr = d.getAttribute("datum");
                // Porovnáme ISO (2026-03-16) nebo český formát (16.03.2026)
                return attr === targetStrISO || attr === targetStrISO.split('-').reverse().join('.');
            });

            // Nastavení nadpisu
            if (targetDate.getDay() === 1 && formatDate(new Date()) !== targetStrISO) {
                label.innerText = 'Menu na pondělí';
            } else if (formatDate(new Date()) === targetStrISO) {
                label.innerText = 'Dnešní Menu';
            } else {
                label.innerText = 'Menu na ' + targetDate.toLocaleDateString('cs-CZ');
            }

            // Pokud cílový den v XML vůbec není, zkusíme vzít ten úplně poslední/nejbližší budoucí
            if (!dayData && days.length > 0) {
                dayData = days[days.length - 1]; 
                const dAttr = dayData.getAttribute("datum");
                label.innerText = 'Menu na ' + dAttr.split('-').reverse().join('.');
            }

            if (!dayData) {
                app.innerHTML = '<div class="no-data">Aktuálně není v systému žádný jídelníček.</div>';
                return;
            }

            const items = Array.from(dayData.getElementsByTagName("polozka"));
            
            // Filtrování jídel s odolností proti diakritice
            const polevky = items.filter(i => {
                const d = i.getAttribute("druh").toLowerCase();
                return d.includes("polévka") || d.includes("polevka");
            });
            const obedy = items.filter(i => {
                const d = i.getAttribute("druh").toLowerCase();
                return d.includes("oběd") || d.includes("obed");
            });

            if (items.length === 0 || (polevky.length === 0 && obedy.length === 0)) {
                app.innerHTML = '<div class="no-data">Jídelníček pro tento den ještě<br>nebyl sestaven.</div>';
                return;
            }

            let html = '';
            if (polevky.length > 0) {
                html += '<div class="section-title">Polévka</div>';
                polevky.forEach(i => html += renderItem(i));
            }
            if (obedy.length > 0) {
                html += '<div class="section-title">Oběd</div>';
                obedy.forEach(i => html += renderItem(i));
            }

            app.innerHTML = html;

        } catch (e) {
            app.innerHTML = '<div class="no-data">Chyba při stahování dat.<br>Zkuste to prosím později.</div>';
        }
    }

    function renderItem(item) {
        const druh = item.getAttribute("druh") || "";
        const nazev = item.getAttribute("nazev") || "";
        const alergenyStr = item.getAttribute("alergeny") || "";
        const alergeny = alergenyStr ? alergenyStr.split(',') : [];
        
        const tag = druh.split(' ').pop();
        const druhBase = druh.includes(" ") ? druh.substring(0, druh.lastIndexOf(" ")) : druh;

        return `
            <div class="card">
                <div class="card-header">
                    <div class="tag">${tag}</div>
                    <div class="dish-name"><b>${druhBase} ${tag}</b> - ${nazev}</div>
                </div>
                <div class="meta">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M21,3C21,3 15.8,3.5 12,7.2C10.1,9.1 8.8,11.4 8,14H4L2,16V17H4.5L5,17.5L5,20H6L8,18V14C10.6,13.2 12.9,11.9 14.8,10C18.5,6.2 19,1 19,1M14,6C14,5.4 14.4,5 15,5C15.6,5 16,5.4 16,6C16,6.6 15.6,7 15,7C14.4,7 14,6.6 14,6Z" /></svg>
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19,19V17H5V19H19M19,7H5V15H19V7M18,3V5H6V3H18M21,15C21,16.1 20.1,17 19,17V15H21M3,15H5V17C3.9,17 3,16.1 3,15M21,7V9H19V7H21M3,7H5V9H3V7Z" /></svg>
                    <div class="allergens">${alergeny.map(a => `<span class="allergen-tag">${a.trim()}</span>`).join('')}</div>
                </div>
            </div>
        `;
    }

    init();
</script>
</body>
</html>
