<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Padlet Nástěnka</title>
    <style>
        /* Odstraní okraje stránky a zajistí, že se obsah nebude hýbat */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Zabrání dvojitému skrolování */
        }

        /* Roztáhne iframe na celou obrazovku */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
    src="https://padlet.com/embed/xet6al33uutzs6wl" 
    allow="camera; microphone; geolocation; display-capture; clipboard-write; autoplay"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
    allowfullscreen
    style="width: 100%; height: 100%; border: none;">
</iframe>

</body>
</html>
