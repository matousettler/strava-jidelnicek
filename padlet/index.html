<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padlet Nástěnka</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #fff;
            overflow: hidden;
        }
        img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <img id="padlet" alt="Padlet nástěnka" />

    <script>
        function getTimestamp() {
            const d = new Date();
            d.setMinutes(d.getMinutes() < 30 ? 0 : 30, 0, 0);
            return d.getTime();
        }

        function load() {
            document.getElementById('padlet').src = '/api/screenshot?_t=' + getTimestamp();
        }

        load();
        setInterval(load, 30 * 60 * 1000);
    </script>
</body>
</html>
