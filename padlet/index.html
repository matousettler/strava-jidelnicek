<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padlet Nástěnka</title>
    <style>
        /* Odstraní okraje stránky a zajistí, že se obsah nebude hýbat */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Zabrání dvojitému skrolování */
        }

        /* Roztáhne iframe na celou obrazovku */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://padlet.com/embed/xet6al33uutzs6wl" 
        allow="camera;microphone;geolocation;display-capture;clipboard-write"
        allowfullscreen>
    </iframe>

</body>
</html>
