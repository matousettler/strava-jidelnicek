<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padlet Nástěnka</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #fff;
            overflow: hidden;
        }
        img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <img id="padlet" alt="Padlet nástěnka" />

    <script>
        const API_URL = 'https://api.screenshotone.com/take?access_key=cgw6R8brZUbS7Q&url=https%3A%2F%2Fpadlet.com%2Fembed%2Fxet6al33uutzs6wl&device_scale_factor=3&viewport_device=ipad_landscape&format=png&block_ads=true&block_cookie_banners=true&block_banners_by_heuristics=false&block_trackers=true&delay=0&timeout=60&response_type=by_format&full_page=true&image_quality=80';
        const INTERVAL = 30 * 60 * 1000; // 30 minut

        function getTimestamp() {
            // Zaokrouhlí na půlhodinu → max 1 nový screenshot za 30 min
            const d = new Date();
            d.setMinutes(d.getMinutes() < 30 ? 0 : 30, 0, 0);
            return d.getTime();
        }

        function load() {
            const img = document.getElementById('padlet');
            img.src = API_URL + '&cache_ttl=1800&_t=' + getTimestamp();
        }

        load();
        setInterval(load, INTERVAL);
    </script>
</body>
</html>
