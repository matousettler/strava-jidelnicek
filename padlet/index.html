<body style="margin:0; background:black; overflow:hidden;">
    <img id="padletImg" src="https://api.screenshotmachine.com/?key=9b8e2a&url=https://padlet.com/matousettler/zpravy-z-velke-britanie-a-irska-xet6al33uutzs6wl&dimension=1920x1080&device=desktop&format=png" style="width:100vw; height:100vh; object-fit: contain;">

    <script>
        // Každých 15 minut obrázek aktualizuje, aby tam byly nové zprávy
        setInterval(function(){
            var img = document.getElementById('padletImg');
            img.src = img.src.split('&ts=')[0] + '&ts=' + new Date().getTime();
        }, 900000);
    </script>
</body>
