<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jídelníček Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-widget: #3b2942; --bg-header: #4c2b4d; --bg-card: #231726;
            --accent-pink: #ef91c5; --text-main: #f1d8e6; --text-dim: #9d8396;
            --font-family: 'Nunito', sans-serif;
        }
        body, html { margin: 0; padding: 0; height: 100%; background: transparent; font-family: var(--font-family); color: var(--text-main); overflow: hidden; }
        .widget { background: var(--bg-widget); border-radius: 28px; display: flex; flex-direction: column; height: 100vh; width: 100%; }
        .header { background: var(--bg-header); padding: 16px 24px; display: flex; align-items: center; flex-shrink: 0; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header-title { display: flex; align-items: center; gap: 12px; font-size: 1.3rem; font-weight: 700; }
        .logo-img { width: 28px; height: 28px; object-fit: contain; }
        .content { padding: 10px 20px 20px 20px; overflow-y: auto; flex-grow: 1; scroll-behavior: smooth; }
        .section-title { color: var(--accent-pink); font-size: 1rem; margin: 25px 0 10px 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(239, 145, 197, 0.2); padding-bottom: 5px; }
        .card { background: var(--bg-card); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
        .card-header { display: flex; gap: 12px; align-items: flex-start; }
        .tag { background: var(--accent-pink); color: var(--bg-card); padding: 2px 6px; border-radius: 6px; font-weight: 800; font-size: 0.75rem; min-width: 42px; text-align: center; flex-shrink: 0; }
        .dish-name { line-height: 1.4; font-size: 1rem; font-weight: 400; }
        .dish-name b { color: var(--accent-pink); font-weight: 700; }
        .meta { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
        .allergen-label { font-size: 0.75rem; color: var(--text-dim); font-weight: 600; margin-right: 4px; }
        .allergens { display: flex; gap: 4px; flex-wrap: wrap; }
        .allergen-tag { font-size: 0.7rem; background: rgba(255,255,255,0.06); color: var(--text-dim); padding: 1px 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); cursor: help; }
        .status-msg { text-align: center; padding: 60px 20px; color: var(--text-dim); }
        .content::-webkit-scrollbar { width: 0; background: transparent; }
    </style>
</head>
<body>
<div class="widget">
    <div class="header">
        <div class="header-title">
            <img src="https://app.strava.cz/logo/logomark.svg" class="logo-img" alt="Logo">
            <span id="label">Načítám menu...</span>
        </div>
    </div>
    <div class="content" id="app">
        <div class="status-msg">Načítám data z jídelen...</div>
    </div>
</div>

<script>
    var ALLERGENS_MAP = { "01":"Obiloviny s lepkem","1":"Obiloviny s lepkem","02":"Korýši","2":"Korýši","03":"Vejce","3":"Vejce","04":"Ryby","4":"Ryby","05":"Arašídy","5":"Arašídy","06":"Sója","6":"Sója","07":"Mléko","7":"Mléko","08":"Ořechy","8":"Ořechy","09":"Celer","9":"Celer","10":"Hořčice","11":"Sezam","12":"Siřičitany","13":"Vlčí bob","14":"Měkkýši" };

    function startAutoScroll() {
        var container = document.getElementById('app');
        var direction = 'down';
        setInterval(function() {
            var canScroll = container.scrollHeight > container.clientHeight;
            if (canScroll) {
                if (direction === 'down') { container.scrollTop = container.scrollHeight; direction = 'up'; }
                else { container.scrollTop = 0; direction = 'down'; }
            }
        }, 12000);
    }

    async function init() {
        var app = document.getElementById('app');
        var label = document.getElementById('label');
        var parser = new DOMParser();

        try {
            var response = await fetch('/api/menu');
            var data = await response.json();
            
            var xml1806 = parser.parseFromString(data.xml1806, "text/xml");
            var xml0398 = parser.parseFromString(data.xml0398, "text/xml");

            // LOGIKA DATUMU
            var now = new Date();
            var target = new Date(now.getTime());
            if (target.getDay() === 6) target.setDate(target.getDate() + 2);
            else if (target.getDay() === 0) target.setDate(target.getDate() + 1);
            else if (target.getDay() === 5 && now.getHours() >= 14) target.setDate(target.getDate() + 3);
            else if (now.getHours() >= 14) target.setDate(target.getDate() + 1);

            var d = String(target.getDate()).padStart(2, '0');
            var m = String(target.getMonth() + 1).padStart(2, '0');
            var y = target.getFullYear();
            var searchStr1 = d + "-" + m + "-" + y;
            var searchStr2 = d + "." + m + "." + y;
            label.innerText = "Menu na " + d + "." + m + "." + y;

            function getDayNode(xml) {
                var days = xml.getElementsByTagName("den");
                for (var i = 0; i < days.length; i++) {
                    var attr = days[i].getAttribute("datum");
                    if (attr === searchStr1 || attr === searchStr2) return days[i];
                }
                return days.length > 0 ? days[0] : null; // Fallback pro AMOS
            }

            var day1806 = getDayNode(xml1806);
            var day0398 = getDayNode(xml0398);

            var groups = {
                "Lyčkovo nám.": [],
                "Pernerova": [],
                "Petra Strozziho": []
            };

            // Zpracování 1806 (Lyčkovo vs Pernerova)
            if (day1806) {
                var items1806 = day1806.getElementsByTagName("jidlo");
                for (var j = 0; j < items1806.length; j++) {
                    var druh = items1806[j].getAttribute("druh");
                    var nazev = items1806[j].getAttribute("nazev");
                    var alergeny = items1806[j].getAttribute("alergeny") || "";
                    
                    var item = { nazev: nazev, druh: druh, alergeny: alergeny };
                    
                    if (druh.indexOf("L") !== -1) groups["Lyčkovo nám."].push(item);
                    if (druh.indexOf("P") !== -1) groups["Pernerova"].push(item);
                }
            }

            // Zpracování 0398 (Petra Strozziho)
            if (day0398) {
                var items0398 = day0398.getElementsByTagName("jidlo");
                for (var k = 0; k < items0398.length; k++) {
                    groups["Petra Strozziho"].push({
                        nazev: items0398[k].getAttribute("nazev"),
                        druh: items0398[k].getAttribute("druh"),
                        alergeny: items0398[k].getAttribute("alergeny") || ""
                    });
                }
            }

            var html = '';
            var hasAny = false;

            for (var groupName in groups) {
                if (groups[groupName].length > 0) {
                    hasAny = true;
                    html += '<div class="section-title">' + groupName + '</div>';
                    groups[groupName].forEach(function(m) {
                        var parts = m.druh.split(' ');
                        var tag = parts.length > 1 ? parts.pop() : m.druh;
                        var baseDruh = parts.join(' ').trim() || m.druh;
                        
                        var allergensHtml = '';
                        if (m.alergeny) {
                            allergensHtml = m.alergeny.split(',').map(function(code) {
                                var clean = code.trim().split(' ')[0];
                                return '<span class="allergen-tag" title="' + (ALLERGENS_MAP[clean] || 'Alergen') + '">' + clean + '</span>';
                            }).join('');
                        }

                        html += '<div class="card">' +
                                    '<div class="card-header">' +
                                        '<div class="tag">' + tag + '</div>' +
                                        '<div class="dish-name"><b>' + baseDruh + ' ' + tag + '</b> - ' + m.nazev + '</div>' +
                                    '</div>' +
                                    (allergensHtml ? '<div class="meta"><span class="allergen-label">Alergeny:</span><div class="allergens">' + allergensHtml + '</div></div>' : '') +
                                '</div>';
                    });
                }
            }

            if (!hasAny) {
                app.innerHTML = '<div class="status-msg">Pro tento den není menu nahrané ani pro jednu budovu.</div>';
            } else {
                app.innerHTML = html;
                startAutoScroll();
            }

        } catch (e) {
            app.innerHTML = '<div class="status-msg">Chyba při stahování dat: ' + e.message + '</div>';
        }
    }
    init();
</script>
</body>
</html>
